<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula-do-cadrastro</title>
</head>
<body>
    <img width="500px" src="https://vonrauber.com.br/wp-content/uploads/2024/06/72799d2a-7c56-42f5-ad0a-d471e830fb5a-1.png" alt="">
    <form>
        <input type="text" placeholder="nome do pet">
        <input type="text" placeholder="dono do pet">
        <input type="text" placeholder="telefone">
        <select>
            <option value="">--- Selecione ---</option>
            <option value="">Lulu</option>
            <option value="">doguinho</option>
            <option value="">salsicha</option>
        </select>
        <button>Cadastrar</button>
    </form>

    <style>
        *{
            margin: 0;
            padding: o;
            box-sizing: border-box;
        }
         body{
            color: white;
            background-color: black;

            display: flex;
         }
         img{
            width: 30%;
            cursor: pointer;
            transition: .9s;
         }
         img:hover{
            width: 60%;
            transform:rotate(360deg)
            comida
         }
         form{  
            margin-top: 20px;
            padding: 20px;
            background-color: bisque;

            display: flex;
            gap: 10px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
         }
         input, select{
            width: 20vw;
            padding: 10px;
            border: none;
            display: block;     
         }
         select{
            text-align: center;
         }
         button{
            background-color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            width: 100px;
            font-weight: bold;
            letter-spacing: 1.2px;
         }
    </style>
</body>
</html>
